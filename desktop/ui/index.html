<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestalt</title>
    <style>
      :root { color-scheme: light dark; --bg:#fff; --panel:#f4f5f7; --fg:#1c1f24; --dim:#5b6370; --border:#d5d9e0; --accent:#2f5fd0; --danger:#c0262d; }
      @media (prefers-color-scheme: dark) { :root { --bg:#16181d; --panel:#1c1f26; --fg:#e3e6eb; --dim:#959daa; --border:#2d323d; --accent:#6c93f0; --danger:#ff7b80; } }
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:14px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
      main { width:min(460px, calc(100% - 32px)); display:flex; flex-direction:column; gap:14px; padding:16px 0; }
      h1 { margin:0; font-size:1.4em; }
      section { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:8px; }
      h2 { margin:0; font-size:1em; }
      p { margin:0; color:var(--dim); font-size:.9em; }
      label { display:flex; flex-direction:column; gap:3px; font-size:.9em; }
      input { border:1px solid var(--border); border-radius:6px; background:var(--bg); color:var(--fg); padding:6px 8px; font:inherit; }
      button { border:1px solid var(--border); border-radius:6px; background:var(--panel); color:var(--fg); padding:6px 12px; font:inherit; cursor:pointer; }
      button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
      button:disabled { opacity:.6; cursor:default; }
      .error { color:var(--danger); }
      .hidden { display:none; }
      #diag { font-size:.8em; color:var(--dim); }
    </style>
  </head>
  <body>
    <main>
      <h1>Gestalt</h1>

      <section id="remote">
        <h2>Connect to a bouncer</h2>
        <p>The address of a Gestalt bouncer that runs on a server, which keeps you connected to IRC while this computer is off.</p>
        <form id="remote-form">
          <label>Address <input id="url" placeholder="https://irc.example.org" autocomplete="url" spellcheck="false" /></label>
          <button class="primary" id="remote-go">Connect</button>
        </form>
        <p class="error" id="remote-error" role="alert"></p>
      </section>

      <section id="local" class="hidden">
        <h2>Run on this computer</h2>
        <p id="local-note">Gestalt starts its own bouncer here. It is connected to IRC only while this app is open.</p>
        <form id="local-form">
          <label id="user-row">Choose a username <input id="user" autocomplete="username" spellcheck="false" /></label>
          <label id="pass-row">Choose a password <input id="pass" type="password" autocomplete="new-password" /></label>
          <button class="primary" id="local-go">Start</button>
        </form>
        <p class="error" id="local-error" role="alert"></p>
      </section>

      <p id="diag"></p>
    </main>
    <script>
      const { invoke } = window.__TAURI__.core
      const $ = (id) => document.getElementById(id)

      async function diagnose() {
        const r = { webrtc: typeof RTCPeerConnection, prefixed: typeof window.webkitRTCPeerConnection, dataChannel: typeof window.RTCDataChannel, mediaStream: typeof window.MediaStream, getUserMedia: typeof navigator.mediaDevices?.getUserMedia, audioContext: typeof (window.AudioContext || window.webkitAudioContext) }
        try {
          const a = new RTCPeerConnection({ iceServers: [] })
          a.createDataChannel('x')
          const offer = await a.createOffer()
          await a.setLocalDescription(offer)
          r.offer = /a=fingerprint:sha-256/i.test(a.localDescription.sdp) ? 'ok with a fingerprint' : 'no fingerprint'
          const t = a.addTransceiver('audio', { direction: 'recvonly' })
          r.audioTransceiver = t ? 'ok' : 'none'
          a.close()
        } catch (e) {
          r.offer = 'failed: ' + e
        }
        r.ua = navigator.userAgent
        return r
      }

      async function init() {
        const state = await invoke('get_state')
        $('url').value = state.settings.url || ''
        if (state.local) {
          $('local').classList.remove('hidden')
          if (state.local_ready) {
            $('user-row').classList.add('hidden')
            $('pass-row').classList.add('hidden')
            $('local-note').textContent = 'Start the bouncer you set up here' + (state.settings.user ? ` (account ${state.settings.user})` : '') + '. It is connected to IRC only while this app is open.'
          }
        }
        const r = await diagnose()
        const ok = r.webrtc === 'function' && r.getUserMedia === 'function' && String(r.offer).startsWith('ok')
        $('diag').textContent = ok ? '' : 'This system’s web view cannot do everything voice and direct chat need: ' + JSON.stringify(r)
        invoke('report', { text: JSON.stringify(r) })
      }

      async function run(button, error, job) {
        button.disabled = true
        error.textContent = ''
        try { await job() } catch (e) { error.textContent = String(e) } finally { button.disabled = false }
      }
      $('remote-form').addEventListener('submit', (e) => {
        e.preventDefault()
        run($('remote-go'), $('remote-error'), () => invoke('connect_remote', { url: $('url').value }))
      })
      $('local-form').addEventListener('submit', (e) => {
        e.preventDefault()
        const first = !$('user-row').classList.contains('hidden')
        run($('local-go'), $('local-error'), () => invoke('start_local', { user: first ? $('user').value : '', password: first ? $('pass').value : '' }))
      })
      init()
    </script>
  </body>
</html>
