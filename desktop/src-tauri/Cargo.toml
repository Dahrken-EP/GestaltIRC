[package]
name = "gestalt-desktop"
version = "0.2.17"
description = "Gestalt IRC, on the desktop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = { version = "0.4", features = ["std"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
# The experimental native media stack: WebRTC in Rust instead of the webview's,
# with audio through cpal and Opus so voice and calls do not depend on WebKit.
webrtc = "0.13"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
cpal = "0.16"
opus = "0.3"
base64 = "0.22"
bytes = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
