name: native-appimage

# The experimental Linux app (Tauri, with the native voice stack) as an AppImage. Used by the release workflow, and by
# attach-native for a release that was made without it.
on:
  workflow_call:
    inputs:
      ref:
        description: 'What to build (a tag or commit); the commit the workflow runs on when empty.'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev libasound2-dev libopus-dev
      - run: |
          npm --prefix desktop ci
          desktop/build-sidecar.sh
      - working-directory: desktop
        run: npx tauri build --bundles appimage
      - uses: actions/upload-artifact@v7
        with:
          name: linux-native
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
