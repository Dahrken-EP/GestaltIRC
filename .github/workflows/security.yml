name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
        working-directory: server

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Only what ships to browsers: the build tools are not in the page.
      - run: npm ci && npm audit --omit=dev --audit-level=high
        working-directory: web

  codeql:
    runs-on: ubuntu-latest
    strategy:
      # One language failing (for instance because code scanning is not switched on for the repository) must not
      # cancel the other.
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version-file: server/go.mod
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
