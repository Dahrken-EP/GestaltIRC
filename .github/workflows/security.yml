name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
        working-directory: server

  npm-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Only what ships to browsers: the build tools are not in the page.
      - run: npm ci && npm audit --omit=dev --audit-level=high
        working-directory: web

  # Code scanning (CodeQL) is not a job here: it runs through the repository's own "default setup" (Settings, Advanced
  # Security, Code scanning). GitHub refuses results from a workflow while that is switched on.
