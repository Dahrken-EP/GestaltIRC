name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go vet -tags integration ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # A real Ergo network, for the tests that need one. Built from its main branch, so a change in Ergo that breaks the bouncer shows up here.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
      - name: Build Ergo
        run: |
          git clone --depth 1 https://github.com/ergochat/ergo "$RUNNER_TEMP/ergo"
          cd "$RUNNER_TEMP/ergo" && go build -o ergo .
      - run: go test -tags integration -race ./integration/
        working-directory: server
        env:
          ERGO_DIR: ${{ runner.temp }}/ergo

  # The browser tests: a real bouncer, a scripted IRC network and Chromium, including real WebRTC and audio.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
        working-directory: web
      - run: test/e2e/run.sh
        env:
          CI: "1"
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/web/node_modules/playwright
