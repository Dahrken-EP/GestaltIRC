name: attach-native

# Adds the experimental Linux AppImage (Tauri) to a release that already exists, built from that release's tag.
# Run it by hand from the Actions tab with the version (for example 0.2.16).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of an existing release, without the v (for example 0.2.16).'
        required: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/native-appimage.yml
    with:
      ref: v${{ inputs.version }}

  attach:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-native
          path: files
      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l files
          gh release upload "v${{ inputs.version }}" files/*.AppImage --repo "$GITHUB_REPOSITORY"
