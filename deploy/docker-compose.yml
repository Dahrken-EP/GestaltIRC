# The bouncer and web client, coturn for peer to peer connections, and Caddy for
# HTTPS. Run ./setup.sh first: it writes .env, bouncer.yaml, turnserver.conf and the
# secrets this file refers to.
#
#   docker compose up -d
#   docker compose run --rm bouncer init
#   echo 'a-long-password' | docker compose run --rm -T bouncer user add matt
#   docker compose run --rm -T bouncer network add matt libera --host irc.libera.chat --tls --nick matt --join '#chan'

services:
  bouncer:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    volumes:
      - data:/data
      - ./bouncer.yaml:/config/bouncer.yaml:ro
      - ./secrets/turn_secret:/run/secrets/turn_secret:ro
    # Not published: only Caddy reaches it.
    expose:
      - "8080"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [bouncer]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?run ./setup.sh to create .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  coturn:
    image: coturn/coturn:4
    restart: unless-stopped
    # Host networking: a TURN relay uses a range of UDP ports and must know its real
    # address. Publishing the range through Docker's proxy is slow and unreliable.
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

volumes:
  data:
  caddy_data:
  caddy_config:
