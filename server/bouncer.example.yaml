# Copy to bouncer.yaml. Users and networks are not in this file. Manage them
# with the admin commands (see README.md).

listen: "127.0.0.1:8080"        # serve plain HTTP here; terminate TLS in a reverse proxy
allowed_origins: []             # extra WebSocket Origin patterns, if the web client is hosted elsewhere
web_dir: ""                     # set to ../web/dist to serve the web client from the bouncer
data_dir: "./data"              # bouncer.db lives here
secret_key_file: "./data/secret.key"  # encrypts network passwords and the push key; back this up
history_limit: 2000             # messages kept per buffer
replay_limit: 200               # messages per buffer replayed when a client attaches

cookie_secure: auto             # auto: Secure when the request came over TLS. always, or never
trust_proxy: false              # true only behind a proxy that sets X-Forwarded-For
sts_duration: 0                 # seconds clients should insist on TLS. 0 = off. Set after TLS works
sts_port: 443                   # TLS port plain-text clients are told to use
push_contact: "mailto:admin@localhost"  # shown to push services; use a real address

# Peer to peer (direct chat, file transfer, voice). coturn serves both lists. With none
# set, browsers still connect when a direct path exists, but not across strict NATs.
stun_uris: []                   # e.g. ["stun:turn.example.org:3478"]
turn_uris: []                   # e.g. ["turn:turn.example.org:3478?transport=udp", "turns:turn.example.org:5349?transport=tcp"]
turn_secret: ""                 # the same value as coturn's static-auth-secret
turn_secret_file: ""            # or read it from a file, to keep it out of this one
turn_ttl: 86400                 # seconds an issued TURN credential works for. A relayed call or transfer ends when its credential does
