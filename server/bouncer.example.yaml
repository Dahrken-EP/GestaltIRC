# Copy to bouncer.yaml. Users and networks are not in this file. Manage them
# with the admin commands (see README.md).

listen: "127.0.0.1:8080"        # serve plain HTTP here; terminate TLS in a reverse proxy
allowed_origins: []             # extra WebSocket Origin patterns, if the web client is hosted elsewhere
data_dir: "./data"              # bouncer.db lives here
secret_key_file: "./data/secret.key"  # encrypts network passwords; back this up
history_limit: 2000             # messages kept per buffer
replay_limit: 200               # messages per buffer replayed when a client attaches
